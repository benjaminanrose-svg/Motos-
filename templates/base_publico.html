<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MotoTaller{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#E53E3E', dark: '#C53030' },
            dark: { DEFAULT: '#1A202C', card: '#2D3748' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans">

  <!-- Navbar -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-xl font-bold text-red-500">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        MotoTaller
      </a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-300">
        <a href="#servicios" class="hover:text-red-400 transition">Servicios</a>
        <a href="#nosotros" class="hover:text-red-400 transition">Nosotros</a>
        <a href="#ubicacion" class="hover:text-red-400 transition">Ubicación</a>
        <a href="#contacto" class="hover:text-red-400 transition">Contacto</a>
        <a href="/login/" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition text-xs font-semibold">
          Acceso Taller
        </a>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  <!-- Footer -->
  <footer class="bg-gray-900 border-t border-gray-800 mt-16">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center text-gray-500 text-sm">
      <p>&copy; {% now "Y" %} MotoTaller — Todos los derechos reservados</p>
    </div>
  </footer>

</body>
</html>

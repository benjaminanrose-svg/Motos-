<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — MotoTaller</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-red-600 rounded-2xl mb-4">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold">MotoTaller</h1>
      <p class="text-gray-400 text-sm mt-1">Acceso al panel de administración</p>
    </div>

    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800">
      {% if form.errors %}
      <div class="mb-4 px-4 py-3 bg-red-900 border border-red-700 rounded-lg text-red-300 text-sm">
        Usuario o contraseña incorrectos.
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Usuario</label>
          <input type="text" name="username" autofocus autocomplete="username"
            class="w-full rounded-lg border border-gray-700 bg-gray-800 text-gray-100 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
            placeholder="Tu usuario">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Contraseña</label>
          <input type="password" name="password" autocomplete="current-password"
            class="w-full rounded-lg border border-gray-700 bg-gray-800 text-gray-100 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
            placeholder="••••••••">
        </div>
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Ingresar
        </button>
      </form>
    </div>

    <p class="text-center text-gray-600 text-xs mt-6">
      <a href="/" class="hover:text-gray-400 transition">← Volver al sitio</a>
    </p>
  </div>
</body>
</html>
